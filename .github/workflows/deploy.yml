name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/moongtaengi-server:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop moongtaengi-server || true
            sudo docker rm moongtaengi-server || true
            
            sudo docker rmi ${{ secrets.DOCKER_USERNAME }}/moongtaengi-server:latest || true
            
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/moongtaengi-server:latest
            
            echo "${{ secrets.ENV_FILE }}" > .env
            chmod 600 .env
            
            sudo docker run -d --name moongtaengi-server \
                          --env-file .env \
                          -p 8080:8080 \
                          ${{ secrets.DOCKER_USERNAME }}/moongtaengi-server:latest
            
            rm .env
            sudo docker image prune -f