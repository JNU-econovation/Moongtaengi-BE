spring:
  config:
    activate:
      on-profile: prod

  #임시적으로 h2 사용
  datasource:
    url: jdbc:h2:mem:moongtaengidb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          time_zone: Asia/Seoul

oauth:
  kakao:
    frontend-redirect-uri: ${KAKAO_FRONTEND_REDIRECT_URI}