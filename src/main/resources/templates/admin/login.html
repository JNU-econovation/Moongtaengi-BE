<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뭉탱이 관리자 - 로그인</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: #efe;
      color: #3c3;
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .success-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <h1>🔐 관리자 로그인</h1>
    <p>뭉탱이 관리자 페이지</p>
  </div>

  <div id="errorMessage" class="error-message"></div>
  <div id="successMessage" class="success-message"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="kakaoId">카카오 ID</label>
      <input
          type="text"
          id="kakaoId"
          name="kakaoId"
          placeholder="관리자 카카오 ID를 입력하세요"
          required
          autocomplete="off"
      >
    </div>

    <button type="submit" class="btn-login">로그인</button>
  </form>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 10px; color: #666;">로그인 중...</p>
  </div>
</div>

<script>
  const loginForm = document.getElementById('loginForm');
  const errorMessage = document.getElementById('errorMessage');
  const successMessage = document.getElementById('successMessage');
  const loading = document.getElementById('loading');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const kakaoId = document.getElementById('kakaoId').value.trim();

    if (!kakaoId) {
      showError('카카오 ID를 입력하세요');
      return;
    }

    // 로딩 시작
    loading.classList.add('show');
    loginForm.style.display = 'none';
    hideMessages();

    try {
      const response = await fetch('/api/admin/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ kakaoId })
      });

      const data = await response.json();

      if (response.ok) {
        // 로그인 성공
        localStorage.setItem('adminToken', data.accessToken);
        localStorage.setItem('adminNickname', data.nickname);
        localStorage.setItem('adminRole', data.role);

        showSuccess('로그인 성공! 대시보드로 이동합니다...');

        // 2초 후 대시보드로 이동
        setTimeout(() => {
          window.location.href = '/admin/dashboard';
        }, 2000);
      } else {
        // 로그인 실패
        showError(data.message || '로그인에 실패했습니다');
        loading.classList.remove('show');
        loginForm.style.display = 'block';
      }
    } catch (error) {
      console.error('로그인 에러:', error);
      showError('서버 연결에 실패했습니다');
      loading.classList.remove('show');
      loginForm.style.display = 'block';
    }
  });

  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.classList.add('show');
    successMessage.classList.remove('show');
  }

  function showSuccess(message) {
    successMessage.textContent = message;
    successMessage.classList.add('show');
    errorMessage.classList.remove('show');
  }

  function hideMessages() {
    errorMessage.classList.remove('show');
    successMessage.classList.remove('show');
  }

  // 페이지 로드 시 이미 로그인되어 있으면 대시보드로 이동
  window.addEventListener('load', () => {
    const token = localStorage.getItem('adminToken');
    if (token) {
      window.location.href = '/admin/dashboard';
    }
  });
</script>
</body>
</html>
